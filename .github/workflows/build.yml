name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/IFFFWorkout_AdHoc.mobileprovision

      - name: Install npm dependencies
        run: npm ci

      - name: Validate app
        run: npm run check

      - name: Expo prebuild (generate iOS project)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Inspect ios/ directory
        run: |
          echo "--- ios/ contents ---"
          ls -la ios/
          echo "--- xcworkspace files ---"
          ls -la ios/*.xcworkspace 2>&1 || echo "(no xcworkspace)"
          echo "--- xcodeproj files ---"
          ls -la ios/*.xcodeproj 2>&1 || echo "(no xcodeproj)"

      - name: Resolve scheme name
        id: scheme
        run: |
          SCHEME=$(ls -d ios/*.xcodeproj 2>/dev/null | head -1 | xargs basename | sed 's/\.xcodeproj$//')
          if [ -z "$SCHEME" ]; then
            echo "ERROR: no .xcodeproj found in ios/"
            exit 1
          fi
          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> $GITHUB_OUTPUT

      - name: Build archive
        run: |
          xcodebuild archive \
            -workspace "ios/${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -archivePath build/IFFF.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=9Y6XS38XC3 \
            PROVISIONING_PROFILE_SPECIFIER=IFFFWorkout_AdHoc \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.aaron.IFFFWorkout</key>
              <string>IFFFWorkout_AdHoc</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/IFFF.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Stage OTA install page
        run: |
          mkdir -p ota
          # The exported IPA filename matches the scheme
          IPA_SRC=$(ls build/export/*.ipa | head -1)
          cp "$IPA_SRC" ota/IFFF.ipa

          cp assets/icon.png ota/icon-57.png
          cp assets/icon.png ota/icon-512.png

          cat > ota/manifest.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>https://aaronbenlerner.github.io/IFFF-app/IFFF.ipa</string>
                  </dict>
                  <dict>
                    <key>kind</key>
                    <string>display-image</string>
                    <key>url</key>
                    <string>https://aaronbenlerner.github.io/IFFF-app/icon-57.png</string>
                  </dict>
                  <dict>
                    <key>kind</key>
                    <string>full-size-image</string>
                    <key>url</key>
                    <string>https://aaronbenlerner.github.io/IFFF-app/icon-512.png</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.aaron.IFFFWorkout</string>
                  <key>bundle-version</key>
                  <string>1.0</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>IFFF</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          cat > ota/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>IFFF - Install</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; text-align: center; background: #09090b; color: #fafafa; }
              h1 { font-weight: 900; letter-spacing: 0.05em; color: #f59e0b; }
              .btn { display: inline-block; padding: 16px 32px; background: #f59e0b; color: #000; text-decoration: none; border-radius: 12px; font-size: 18px; font-weight: 700; margin: 20px 0; }
              .btn:active { background: #d97706; }
              .note { color: #71717a; font-size: 14px; margin-top: 20px; }
            </style>
          </head>
          <body>
            <h1>IFFF</h1>
            <p>Workout tracker</p>
            <a class="btn" href="itms-services://?action=download-manifest&url=https://aaronbenlerner.github.io/IFFF-app/manifest.plist">
              Install App
            </a>
            <p class="note">Open this page in Safari on your iPhone.<br>After installing, go to Settings &gt; General &gt; VPN &amp; Device Management to trust the developer profile.</p>
          </body>
          </html>
          HTML

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFFF
          path: build/export/*.ipa

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true
